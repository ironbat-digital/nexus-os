# EXAMPLE FIXTURE — validates against v1alpha1/nexus.blueprint.schema.json
# Personal Local Stack v1 (personal-local-v1): the ONE opinionated local stack.
# Self-hosted, single owner, no Operator, no Hub. Local Runtime; hosted LLM via an
# Anthropic and/or OpenAI connector token supplied BY REFERENCE (never inlined).
apiVersion: nexus.io/v1alpha1
kind: Blueprint
metadata:
  name: personal-local
  blueprint_version: 1
  generated_at: "2026-07-20T09:00:00Z"
spec:
  modality: self_hosted
  data_region: local
  instance_kind: personal
  expected_users: 1
  areas:
    - { slug: personal_organization, label: "Personal organization" }
    - { slug: comms, label: "Communications" }
  agents:
    - { id: inbox_triage, area: comms, autonomy: human_led }
  llms:
    # Provider-level roles only. Concrete model selection is resolved by the Runtime
    # connector at run time; no model SKU, plan or purchasing is hardcoded here.
    enabled_providers: [anthropic, openai]
    roles:
      planner: "anthropic"
      coordinator: "anthropic"
      worker: "anthropic"
      embeddings: "openai"
    # Personal Local Stack v1 locks deterministic routing with one retry and NO provider fallback;
    # the PersonalStack lock (spec.llm.provider_fallback:false) is the machine source of truth.
    allow_fallback: false
  memory:
    driver: sqlite
    graph: false
    retention_days: 0
    encryption_at_rest: true
  requested_permissions:
    - provider: anthropic
      reason: "LLM connector token for planner/coordinator/worker roles (by reference)."
    - provider: openai
      reason: "LLM connector token for embeddings and fallback (by reference)."
  cost_estimate:
    currency: USD
    monthly_low: 0
    monthly_high: 0
    drivers: ["self-hosted runtime; cost driven by owner's own LLM usage"]
  rationale: >
    Personal Local Stack v1. Exactly one predefined local stack: Docker Compose runtime,
    embedded SQLite with encryption at rest, loopback-only binding, and a hosted LLM
    connector (Anthropic and/or OpenAI) configured by secret reference. No architecture,
    infrastructure, provider or modality choice is offered at first run — those are Hub
    capabilities. See Spec N and ADR-0012.
